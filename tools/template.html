<!doctype html>
<html><head><meta charset="utf-8">
<style>
__FONTS__
  /* Tokens taken from poppunk101.com (oklch converted to hex) */
  :root{
    --background:#06090d; --foreground:#fbf5df; --card:#0b151c; --border:#1f303b;
    --primary:#f80a72; --accent:#1bc3f3; --muted:#95b3c3;
    --gradient-punk:linear-gradient(120deg,var(--primary) 0%,var(--primary) 45%,var(--accent) 100%);
    --glow:0 0 40px -5px var(--primary);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;background:var(--background);color:var(--foreground);
       font-family:"Barlow",system-ui,sans-serif;position:relative;overflow:hidden}
  /* checkerboard like the hero section */
  .checker{position:absolute;inset:0;opacity:.55;
    background:
      conic-gradient(#0d1a22 25%,transparent 0 50%,#0d1a22 0 75%,transparent 0) 0 0/90px 90px;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(27,195,243,.14),transparent 60%),
            radial-gradient(ellipse at 50% 100%,rgba(248,10,114,.22),transparent 55%)}
  .header{position:absolute;left:0;right:0;top:0;height:120px;background:rgba(6,9,13,.9);border-bottom:1px solid var(--border);
          display:flex;align-items:center;justify-content:space-between;padding:0 56px}
  .brand{display:flex;align-items:center;gap:20px}
  .brand img{height:84px;width:auto}
  .brand .name{font-family:"Bebas Neue",Impact,sans-serif;font-size:54px;letter-spacing:1.5px}
  .brand .name b{font-weight:400;color:var(--accent)}
  .tag{font-weight:700;font-size:26px;letter-spacing:7px;color:var(--primary)}
  .np{position:absolute;left:56px;top:158px;display:flex;align-items:center;gap:18px;
      font-family:"Bebas Neue",Impact,sans-serif;font-size:64px;letter-spacing:3px;color:var(--primary)}
  .eq{display:flex;align-items:flex-end;gap:5px;height:46px}
  .eq i{display:block;width:8px;background:var(--gradient-punk);border-radius:2px}
  .card{position:absolute;left:56px;right:56px;top:250px;height:620px;background:var(--card);
        border:1px solid var(--border);border-radius:6px;box-shadow:0 0 60px -12px rgba(248,10,114,.55);overflow:hidden}
  .card img.photo{width:100%;height:100%;object-fit:cover}
  .typo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;
        background:var(--gradient-punk);position:relative}
  .typo:before{content:"";position:absolute;inset:0;background:conic-gradient(rgba(6,9,13,.22) 25%,transparent 0 50%,rgba(6,9,13,.22) 0 75%,transparent 0) 0 0/70px 70px}
  .typo span{position:relative;font-family:"Bebas Neue",Impact,sans-serif;text-transform:uppercase;line-height:.92;color:var(--foreground);
             text-shadow:0 6px 0 rgba(6,9,13,.55),0 0 40px rgba(6,9,13,.35);letter-spacing:2px}
  .credit{position:absolute;right:62px;top:878px;font-size:17px;font-weight:500;color:var(--muted)}
  .info{position:absolute;left:56px;right:56px;top:915px}
  .artist{font-family:"Bebas Neue",Impact,sans-serif;font-size:104px;line-height:.95;letter-spacing:1px;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:20px;margin-top:10px}
  .song{font-family:"Bebas Neue",Impact,sans-serif;font-size:58px;letter-spacing:1px;color:var(--accent);line-height:1}
  .year{font-weight:700;font-size:28px;letter-spacing:2px;color:var(--foreground);border:1px solid var(--primary);border-radius:6px;padding:4px 16px;
        background:rgba(248,10,114,.15)}
  .cta{position:absolute;left:56px;right:56px;bottom:56px;display:flex;flex-direction:column;gap:18px}
  .btn{height:112px;border-radius:6px;background:var(--gradient-punk);display:flex;align-items:center;justify-content:center;gap:26px;
       box-shadow:0 0 0 13px rgba(248,10,114,.15),var(--glow)}
  .btn .play{width:0;height:0;border-left:44px solid var(--foreground);border-top:28px solid transparent;border-bottom:28px solid transparent}
  .btn span{font-family:"Bebas Neue",Impact,sans-serif;font-size:76px;letter-spacing:2px;color:var(--foreground)}
  .sub{text-align:center;font-weight:700;font-size:26px;letter-spacing:6px;color:var(--muted);text-transform:uppercase}
  .sub b{color:var(--primary)}
</style></head>
<body>
  <div class="checker"></div><div class="vignette"></div>
  <div class="header">
    <div class="brand">__LOGO__<div class="name">POP PUNK <b>101</b></div></div>
    <div class="tag">RADIO 24/7</div>
  </div>
  <div class="np"><div class="eq"><i style="height:22px"></i><i style="height:40px"></i><i style="height:30px"></i><i style="height:46px"></i><i style="height:26px"></i></div>NOW PLAYING</div>
  <div class="card">__PHOTO__</div>
  __CREDIT__
  <div class="info">
    <div class="artist" style="font-size:__ASIZE__px;white-space:nowrap">__ARTIST__</div>
    <div class="row"><div class="song" style="font-size:__SSIZE__px;white-space:nowrap">__SONG__</div><div class="year">__YEAR__</div></div>
  </div>
  <div class="cta">
    <div class="btn"><div class="play"></div><span>LISTEN – LINK IN BIO</span></div>
    <div class="sub">Now playing on <b>POP PUNK 101</b> · 24 hours a day</div>
  </div>
</body></html>
